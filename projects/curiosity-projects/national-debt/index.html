<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>US National Debt vs. Party in Power</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-annotation/3.0.1/chartjs-plugin-annotation.min.js"></script>
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/13.0.3/marked.min.js"></script>
<link rel="stylesheet" href="/site.css">
<style>
  :root {
    --bg: #f7f7f8;
    --surface: #ffffff;
    --ink: #1a1a1a;
    --muted: #6e6e6e;
    --border: #e2e2e4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15161a;
      --surface: #1f2024;
      --ink: #eaeaea;
      --muted: #9a9a9a;
      --border: #333438;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px 48px;
    background: var(--bg);
    color: var(--ink);
    font-family: "Helvetica Neue", Arial, sans-serif;
  }
  header {
    max-width: 1100px;
    margin: 0 auto 24px;
  }
  h1 {
    font-size: 1.6rem;
    margin: 0 0 4px;
  }
  header p {
    color: var(--muted);
    margin: 0;
  }
  .controls {
    max-width: 1100px;
    margin: 0 auto 20px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .controls label { font-size: 0.9rem; color: var(--muted); }
  .controls input {
    width: 80px;
    padding: 6px 8px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink);
  }
  .controls button {
    padding: 7px 14px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink);
    cursor: pointer;
  }
  .charts {
    max-width: 1100px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr;
    gap: 20px;
  }
  @media (min-width: 900px) {
    .charts { grid-template-columns: 1fr 1fr; }
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
  }
  .card h2 {
    font-size: 1rem;
    margin: 0 0 12px;
  }
  .card canvas { width: 100% !important; }
  .legend {
    max-width: 1100px;
    margin: 20px auto 0;
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    font-size: 0.85rem;
    color: var(--muted);
  }
  .legend span.swatch {
    display: inline-block;
    width: 12px;
    height: 12px;
    border-radius: 3px;
    margin-right: 6px;
    vertical-align: -1px;
  }
  .status {
    max-width: 1100px;
    margin: 0 auto;
    color: var(--muted);
    font-size: 0.85rem;
  }
  .about {
    max-width: 700px;
    margin: 28px auto 0;
    font-size: 1.15rem;
    line-height: 1.5;
  }
  .about p { margin: 0 0 12px; }
  .about a, .about a:visited { color: var(--link); overflow-wrap: anywhere; }
</style>
</head>
<body>
<script src="/nav.js"></script>

<header id="pageHeader">
  <h1>US National Debt vs. Party in Power</h1>
  <p>Total outstanding debt and its rate of change, shaded by the party holding the presidency.</p>
</header>

<div class="controls">
  <label for="startYear">From</label>
  <input id="startYear" type="number" min="1700" max="2100">
  <label for="endYear">To</label>
  <input id="endYear" type="number" min="1700" max="2100">
  <button id="redraw">Update</button>
  <span id="status" class="status"></span>
</div>

<div class="charts">
  <div class="card">
    <h2>Total Debt Over Time</h2>
    <canvas id="debtChart" height="260"></canvas>
  </div>
  <div class="card">
    <h2>Debt Derivative Over Time</h2>
    <canvas id="derivativeChart" height="260"></canvas>
  </div>
</div>

<div id="partyLegend" class="legend"></div>

<section id="about" class="about"></section>

<script>
// All data processing lives in debt_viz.py, run in the browser via Pyodide;
// this page only fetches the files, calls web_payload(), and plots the result.
const PYODIDE_FILES = [
  "data/hst_debt.json",
  "data/us_party_in_power_by_year.json",
];
const PYTHON_MODULE_PATH = "debt_viz.py";
const CONTENT_MD_PATH = "content.md";

// Page text lives in content.md so it can be edited as plain markdown
// without touching this file. A line of "---" splits it: everything above
// becomes the page header, everything below shows under the charts.
// Falls back to the hardcoded HTML above if missing/invalid.
async function loadContent() {
  try {
    const res = await fetch(CONTENT_MD_PATH);
    if (!res.ok) throw new Error(`Failed to load ${CONTENT_MD_PATH}: ${res.status}`);
    const raw = await res.text();
    const [headerMd, ...rest] = raw.split(/\n-{3,}\n/);
    document.getElementById("pageHeader").innerHTML = marked.parse(headerMd);
    if (rest.length) {
      document.getElementById("about").innerHTML = marked.parse(rest.join("\n---\n"));
    }
  } catch (err) {
    console.warn("content.md not loaded:", err);
  }
}

const NEGATIVE_COLOR = "#00FFFF";

let debtChart, derivativeChart, pyodide, debtViz;

async function fetchText(path) {
  const res = await fetch(path);
  if (!res.ok) throw new Error(`Failed to load ${path}: ${res.status}`);
  return res.text();
}

// Boots Pyodide once, copies debt_viz.py and its data files into its virtual
// filesystem (same relative paths the script uses), and imports the module.
async function initPython() {
  if (debtViz) return;
  document.getElementById("status").textContent = "Loading Python…";
  pyodide = await loadPyodide();
  await pyodide.loadPackage(["numpy", "pandas"]);
  pyodide.FS.mkdir("data");
  for (const path of [...PYODIDE_FILES, PYTHON_MODULE_PATH]) {
    pyodide.FS.writeFile(path, await fetchText(path));
  }
  debtViz = pyodide.pyimport("debt_viz");
}

function hexToRgba(hex, alpha) {
  const n = parseInt(hex.slice(1), 16);
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}

function buildPartyAnnotations(partyRows) {
  const annotations = {};
  partyRows.forEach((row, i) => {
    annotations[`party${i}`] = {
      type: "box",
      xMin: row.start,
      xMax: row.end,
      backgroundColor: hexToRgba(row.color, 0.3),
      borderWidth: 0,
      drawTime: "beforeDatasetsDraw",
    };
  });
  return annotations;
}

function renderPartyLegend(partyRows, hasNegative) {
  const present = new Map(partyRows.map(r => [r.party, r.color]));
  const el = document.getElementById("partyLegend");
  el.innerHTML = [...present].map(([party, color]) =>
    `<span><span class="swatch" style="background:${color}"></span>${party}</span>`
  ).join("");
  if (hasNegative) {
    el.innerHTML += `<span><span class="swatch" style="background:${NEGATIVE_COLOR}"></span>Debt falling (derivative &lt; 0)</span>`;
  }
}

// Adds an interpolated point at each zero crossing so the line changes color
// exactly at y = 0.
function withZeroCrossings(points) {
  const out = [];
  points.forEach((pt, i) => {
    const prev = points[i - 1];
    if (prev && prev.y * pt.y < 0) {
      out.push({ x: prev.x - prev.y * (pt.x - prev.x) / (pt.y - prev.y), y: 0 });
    }
    out.push(pt);
  });
  return out;
}

function makeChart(canvasId, label, points, annotations, yLabel, xMin, xMax) {
  const ctx = document.getElementById(canvasId).getContext("2d");
  return new Chart(ctx, {
    type: "line",
    data: {
      datasets: [{
        label,
        data: points,
        borderColor: "#000000",
        borderWidth: 3,
        pointRadius: 0,
        tension: 0,
        segment: {
          borderColor: ctx => (ctx.p0.parsed.y < 0 || ctx.p1.parsed.y < 0) ? NEGATIVE_COLOR : undefined,
        },
      }],
    },
    options: {
      responsive: true,
      animation: false,
      scales: {
        x: {
          type: "linear",
          min: xMin,
          max: xMax,
          ticks: {
            callback: v => new Date(v).getUTCFullYear(),
          },
          title: { display: true, text: "Date" },
        },
        y: {
          title: { display: true, text: yLabel },
        },
      },
      plugins: {
        legend: { display: true },
        annotation: { annotations },
      },
    },
  });
}

async function draw() {
  const status = document.getElementById("status");
  status.textContent = "Loading…";
  await initPython();

  const startInput = document.getElementById("startYear");
  const endInput = document.getElementById("endYear");
  const hasRange = startInput.value || endInput.value;

  // Empty inputs (first load) get Python's default range, then fill in.
  const payload = JSON.parse(hasRange
    ? debtViz.web_payload(startInput.value ? `${startInput.value}` : null,
                          endInput.value ? `${endInput.value}-12-31` : null)
    : debtViz.web_payload());
  const debtRows = payload.debt;
  const partyRows = payload.party;

  if (!hasRange) {
    startInput.value = new Date(partyRows[0].start).getUTCFullYear();
    endInput.value = new Date(debtRows[debtRows.length - 1].t).getUTCFullYear();
  }
  const xMin = Date.UTC(Number(startInput.value), 0, 1);
  const xMax = Date.UTC(Number(endInput.value) + 1, 0, 1);

  const annotations = buildPartyAnnotations(partyRows);

  if (debtChart) debtChart.destroy();
  if (derivativeChart) derivativeChart.destroy();

  debtChart = makeChart(
    "debtChart", "Total Debt",
    debtRows.map(r => ({ x: r.t, y: r.value })),
    annotations, "Total Debt (Billions of Dollars)", xMin, xMax
  );
  derivativeChart = makeChart(
    "derivativeChart", "d(Debt)/d(Time)",
    withZeroCrossings(debtRows.map(r => ({ x: r.t, y: r.derivative }))),
    annotations, "Debt Derivative (Billions of Dollars per Year)", xMin, xMax
  );

  renderPartyLegend(partyRows, debtRows.some(r => r.derivative < 0));
  status.textContent = `${debtRows.length} debt records, ${partyRows.length} years shown.`;
}

function drawWithErrors() {
  return draw().catch(err => {
    document.getElementById("status").textContent = `Error: ${err.message}`;
    console.error(err);
  });
}

document.getElementById("redraw").addEventListener("click", drawWithErrors);
loadContent();
drawWithErrors();
</script>

</body>
</html>
