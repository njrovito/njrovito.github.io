<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Curiosity Projects</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/13.0.3/marked.min.js"></script>
<style>
  :root {
    --bg: #f7f7f8;
    --surface: #ffffff;
    --ink: #1a1a1a;
    --muted: #6e6e6e;
    --border: #e2e2e4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15161a;
      --surface: #1f2024;
      --ink: #eaeaea;
      --muted: #9a9a9a;
      --border: #333438;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px 48px;
    background: var(--bg);
    color: var(--ink);
    font-family: "Helvetica Neue", Arial, sans-serif;
  }
  main { max-width: 700px; margin: 0 auto; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  p.subtitle { color: var(--muted); margin: 0 0 24px; }
  ul.projects { list-style: none; padding: 0; margin: 0; }
  ul.projects li {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 12px;
  }
  ul.projects a {
    font-size: 1.05rem;
    font-weight: 600;
    color: var(--ink);
    text-decoration: none;
  }
  ul.projects a:hover { text-decoration: underline; }
  ul.projects p {
    margin: 6px 0 0;
    color: var(--muted);
    font-size: 0.9rem;
  }
  ul.projects .also {
    margin-top: 8px;
    font-size: 0.85rem;
  }
  ul.projects .also a {
    font-size: 0.85rem;
    font-weight: 400;
  }
  h2.section {
    font-size: 1rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin: 28px 0 10px;
  }
  h2.section:first-of-type { margin-top: 0; }
  #content { margin: 0 0 24px; line-height: 1.5; }
  #content:empty { display: none; }
  #content p { margin: 0 0 12px; }
</style>
</head>
<body>
<script src="/nav.js"></script>
<main>
  <h1>Curiosity Projects</h1>
  <section id="content"></section>

  <h2 class="section">Static builds</h2>
  <ul class="projects">
    <li>
      <a href="national-debt/">US National Debt vs. Party in Power</a>
      <p>Total U.S. debt and its rate of change over time, shaded by which party held the presidency.</p>
      <!-- <p class="also"><a href="notebooks/notebooks/index.html?path=national_debt/debt_viz.ipynb">→ open the page</a></p> -->
    </li>
  </ul>

  <!-- <h2 class="section">Runnable Notebooks</h2>
  <p class="subtitle" style="margin-bottom:12px;">Live Python, running in your browser (no server) — edit and re-run the code.</p>
  <ul class="projects">
    <li>
      <a href="notebooks/notebooks/index.html?path=national_debt/debt_viz.ipynb">US National Debt — notebook</a>
      <p>The full data pipeline behind the chart below, as a runnable JupyterLite notebook.</p>
    </li>
  </ul> -->

</main>
<script>
// Page text lives in content.md so it can be edited as plain markdown.
(async () => {
  try {
    const res = await fetch("content.md");
    if (!res.ok) throw new Error(`content.md: ${res.status}`);
    document.getElementById("content").innerHTML = marked.parse(await res.text());
  } catch (err) {
    console.warn("content.md not loaded:", err);
  }
})();
</script>
</body>
</html>
